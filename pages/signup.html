<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Join ChopCircle</title>
  <link rel="icon" href="../assets/logos/favicon.svg" />
  <link rel="manifest" href="../manifest.json" />
  <meta name="theme-color" content="#E8542A" />
  <link rel="apple-touch-icon" href="../assets/logos/apple-touch-icon.png" />
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body>
  <div class="auth-layout">
    <aside class="auth-layout__visual" style="--auth-bg-image:url('https://images.unsplash.com/photo-1626200419199-391ae4be7a41?w=1200&q=80')">
      <a href="../index.html" class="logo" style="color:var(--text-inverse)">
        <span class="logo__mark" aria-hidden="true"></span>ChopCircle
      </a>
      <blockquote>
        “I started posting my okro soup process and now people ask me questions every week.”
        <cite>— Grace E., Port Harcourt</cite>
      </blockquote>
    </aside>

    <div class="auth-layout__form">
      <div class="auth-card">
        <h1>Join your circle</h1>
        <p class="text-muted">Free forever. Start sharing what you cook.</p>

        <form id="signup-form" novalidate>
          <div class="field">
            <label for="displayName">Full name</label>
            <input type="text" id="displayName" name="displayName" autocomplete="name" required />
            <div class="field__error" id="displayName-error" role="alert"></div>
          </div>

          <div class="field">
            <label for="email">Email address</label>
            <input type="email" id="email" name="email" autocomplete="email" required />
            <div class="field__error" id="email-error" role="alert"></div>
          </div>

          <div class="field field--password">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" autocomplete="new-password" minlength="8" required />
            <button type="button" id="toggle-password" tabindex="-1">Show</button>
            <div class="field__hint">At least 8 characters.</div>
            <div class="field__error" id="password-error" role="alert"></div>
          </div>

          <label class="flex items-center gap-2 text-sm" style="margin-bottom:var(--space-5)">
            <input type="checkbox" name="terms" style="width:auto" required />
            I agree to the <a href="#" style="color:var(--brand-primary);font-weight:600">Terms</a> and <a href="#" style="color:var(--brand-primary);font-weight:600">Privacy Policy</a>
          </label>

          <div class="field__error" id="form-error" role="alert" style="margin-bottom:var(--space-3)"></div>

          <button type="submit" class="btn btn--primary btn--full btn--lg" id="signup-submit">Create account</button>
        </form>

        <div class="divider-or">or</div>

        <button type="button" class="btn btn--google btn--full btn--lg" id="google-signup">
          <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" width="18" height="18" alt="" />
          Continue with Google
        </button>

        <p class="auth-card__footer">Already cooking with us? <a href="login.html">Log in</a></p>
      </div>
    </div>
  </div>

  <script type="module" src="../js/auth/signup.js"></script>
</body>
</html>
