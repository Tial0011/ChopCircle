<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Log in — ChopCircle</title>
  <link rel="icon" href="../assets/logos/favicon.svg" />
  <link rel="manifest" href="../manifest.json" />
  <meta name="theme-color" content="#E8542A" />
  <link rel="apple-touch-icon" href="../assets/logos/apple-touch-icon.png" />
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body>
  <div class="auth-layout">
    <aside class="auth-layout__visual" style="--auth-bg-image:url('../assets/food/jollof-plantain-chicken.jpg')">
      <a href="../index.html" class="logo" style="color:var(--text-inverse)">
        <span class="logo__mark" aria-hidden="true"></span>ChopCircle
      </a>
      <blockquote>
        “The best jollof recipe I've ever made came from someone I followed here.”
        <cite>— Funmi A., Lagos</cite>
      </blockquote>
    </aside>

    <div class="auth-layout__form">
      <div class="auth-card">
        <h1>Welcome back</h1>
        <p class="text-muted">Log in to keep cooking with your circle.</p>

        <form id="login-form" novalidate>
          <div class="field">
            <label for="email">Email address</label>
            <input type="email" id="email" name="email" autocomplete="email" required />
            <div class="field__error" id="email-error" role="alert"></div>
          </div>

          <div class="field field--password">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" autocomplete="current-password" required />
            <button type="button" id="toggle-password" tabindex="-1">Show</button>
            <div class="field__error" id="password-error" role="alert"></div>
          </div>

          <div class="flex justify-between items-center" style="margin-bottom:var(--space-5)">
            <label class="flex items-center gap-2 text-sm">
              <input type="checkbox" name="remember" style="width:auto" /> Remember me
            </label>
            <a href="forgot-password.html" class="text-sm" style="color:var(--brand-primary);font-weight:600">Forgot password?</a>
          </div>

          <div class="field__error" id="form-error" role="alert" style="margin-bottom:var(--space-3)"></div>

          <button type="submit" class="btn btn--primary btn--full btn--lg" id="login-submit">Log in</button>
        </form>

        <div class="divider-or">or</div>

        <button type="button" class="btn btn--google btn--full btn--lg" id="google-login">
          <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" width="18" height="18" alt="" />
          Continue with Google
        </button>

        <p class="auth-card__footer">New to ChopCircle? <a href="signup.html">Create an account</a></p>
      </div>
    </div>
  </div>

  <script type="module" src="../js/auth/login.js"></script>
</body>
</html>
